
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f3ec">

    <title>Lupa Password | SakuHemat</title>

    <link rel="stylesheet" href="https://raw.githubusercontent.com/jay123-dotcom/sakuhemat/refs/heads/main/lupa-password.css">

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="reset-wrapper">

        <section class="reset-card">

            <a href="login.html" class="back-link">
                ← Kembali ke Login
            </a>

            <div class="reset-brand">
                <div class="brand-icon">S</div>
                <span>SAKU<span>HEMAT.</span></span>
            </div>

            <div class="reset-illustration">
                <div class="illustration-circle">
                    <span class="lock-icon">🔐</span>
                </div>
                <span class="spark spark-one">✦</span>
                <span class="spark spark-two">✧</span>
                <span class="spark spark-three">✦</span>
            </div>

            <div class="reset-heading">
                <span class="eyebrow">ACCOUNT RECOVERY</span>

                <h1>LUPA<br><span>PASSWORD?</span></h1>

                <p>
                    Tenang, kamu bisa membuat password baru
                    untuk kembali mengakses akun SakuHemat.
                </p>
            </div>

            <div class="reset-form">

                <label for="email">EMAIL AKUN</label>

                <div class="input-box">
                    <span>✉</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email akun"
                        autocomplete="email"
                    >
                </div>

                <label for="passwordBaru">PASSWORD BARU</label>

                <div class="input-box">
                    <span>🔑</span>
                    <input
                        type="password"
                        id="passwordBaru"
                        placeholder="Buat password baru"
                        autocomplete="new-password"
                    >
                </div>

                <p class="reset-note">
                    ⚠️ Pastikan email sesuai dengan akun yang terdaftar.
                </p>

                <button type="button" id="tombolReset">
                    RESET PASSWORD
                    <span>↗</span>
                </button>

            </div>

            <div class="reset-footer">
                SMART SAVING • BETTER FUTURE
            </div>

        </section>

    </main>

    <!-- POPUP -->
    <div class="popup-overlay" id="popupOverlay">

        <div class="popup-card">

            <div class="popup-icon" id="popupIcon">✅</div>

            <h2 id="popupTitle">Berhasil!</h2>

            <p id="popupMessage">
                Password berhasil diperbarui.
            </p>

            <button type="button" id="popupButton">
                MENGERTI
            </button>

        </div>

    </div>

    <script src="auth.js?v=5"></script>

</body>
</html>
